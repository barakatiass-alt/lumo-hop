name: iOS compile check
# Runs only when asked: from the Actions tab, or by pushing a tag that starts with "check-".
on:
  workflow_dispatch: {}
  push:
    tags: ["check-*"]

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Game rule tests
        run: |
          swiftc -O ios/LumoHop/GameCore.swift ios/CoreTests/main.swift -o /tmp/coretests
          /tmp/coretests
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project LumoHop.xcodeproj -scheme LumoHop -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80
