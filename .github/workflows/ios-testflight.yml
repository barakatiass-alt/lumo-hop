name: iOS TestFlight
# Signed App Store build, uploaded to App Store Connect (TestFlight).
# Starts only from the Actions tab or by pushing a tag that starts with "release-".
# Needs three repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an App Store Connect API key with the Admin role).
on:
  workflow_dispatch: {}
  push:
    tags: ["release-*"]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Game rule tests
        run: |
          swiftc -O ios/LumoHop/GameCore.swift ios/CoreTests/main.swift -o /tmp/coretests
          /tmp/coretests
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Write the API key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then echo "Missing App Store Connect secrets"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project LumoHop.xcodeproj -scheme LumoHop -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LumoHop.xcarchive" \
            DEVELOPMENT_TEAM=2V93BGJAC6 CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 120
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cd ios
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LumoHop.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 120
      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
